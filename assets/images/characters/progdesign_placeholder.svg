<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- 程设：理性、整洁，蓝白配色 -->
  <defs>
    <radialGradient id="face" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#F5C9B0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="250" fill="#E6EEF7"/>
  <!-- 身体 -->
  <rect x="50" y="160" width="100" height="90" fill="#3B5BA5"/>
  <!-- 头 -->
  <circle cx="100" cy="100" r="50" fill="url(#face)"/>
  <!-- 头发（短直，理性） -->
  <path d="M50 90 Q60 50 100 50 Q140 50 150 90 L150 105 Q140 75 100 75 Q60 75 50 105 Z"
        fill="#2C3E50"/>
  <!-- 眼镜 -->
  <circle cx="85" cy="105" r="11" fill="none" stroke="#2C3E50" stroke-width="2"/>
  <circle cx="115" cy="105" r="11" fill="none" stroke="#2C3E50" stroke-width="2"/>
  <line x1="96" y1="105" x2="104" y2="105" stroke="#2C3E50" stroke-width="2"/>
  <!-- 眼睛 -->
  <circle cx="85" cy="105" r="3" fill="#1A1A1A"/>
  <circle cx="115" cy="105" r="3" fill="#1A1A1A"/>
  <!-- 嘴 -->
  <path d="M92 130 Q100 134 108 130" stroke="#8B1A1A" stroke-width="2" fill="none"/>
  <!-- 名字标签 -->
  <text x="100" y="240" text-anchor="middle"
        font-family="sans-serif" font-size="14" fill="#FFF" font-weight="bold">程设</text>
</svg>
