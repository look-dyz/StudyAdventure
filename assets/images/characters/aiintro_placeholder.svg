<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- AI引论：未来、酷感，青绿色调 -->
  <defs>
    <radialGradient id="face4" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#F5C9B0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="250" fill="#E5F1EA"/>
  <!-- 身体 -->
  <rect x="50" y="160" width="100" height="90" fill="#276749"/>
  <!-- 头 -->
  <circle cx="100" cy="100" r="50" fill="url(#face4)"/>
  <!-- 短发，有几束高亮 -->
  <path d="M52 90 Q60 50 100 50 Q140 50 148 90 L148 100 Q140 80 100 80 Q60 80 52 100 Z"
        fill="#2D6A4F"/>
  <!-- 高亮 -->
  <path d="M75 60 L80 80" stroke="#52B788" stroke-width="2"/>
  <path d="M125 60 L120 80" stroke="#52B788" stroke-width="2"/>
  <!-- 眼睛（科技感） -->
  <circle cx="85" cy="105" r="6" fill="#52B788"/>
  <circle cx="85" cy="105" r="3" fill="#1A1A1A"/>
  <circle cx="115" cy="105" r="6" fill="#52B788"/>
  <circle cx="115" cy="105" r="3" fill="#1A1A1A"/>
  <!-- 嘴（自信微笑） -->
  <path d="M90 128 Q100 134 110 128" stroke="#8B1A1A" stroke-width="2" fill="none"/>
  <!-- 神经网络节点装饰 -->
  <circle cx="30" cy="100" r="3" fill="#276749" opacity="0.5"/>
  <circle cx="30" cy="120" r="3" fill="#276749" opacity="0.5"/>
  <circle cx="40" cy="110" r="3" fill="#276749" opacity="0.5"/>
  <line x1="30" y1="100" x2="40" y2="110" stroke="#276749" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="120" x2="40" y2="110" stroke="#276749" stroke-width="1" opacity="0.4"/>
  <!-- 名字标签 -->
  <text x="100" y="240" text-anchor="middle"
        font-family="sans-serif" font-size="13" fill="#FFF" font-weight="bold">AI 引论</text>
</svg>
