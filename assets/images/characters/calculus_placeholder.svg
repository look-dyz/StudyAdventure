<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- 高数：抽象、神秘，紫色调 -->
  <defs>
    <radialGradient id="face2" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#F5C9B0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="250" fill="#F0E6F5"/>
  <!-- 身体 -->
  <rect x="50" y="160" width="100" height="90" fill="#5A189A"/>
  <!-- 头 -->
  <circle cx="100" cy="100" r="50" fill="url(#face2)"/>
  <!-- 长发 -->
  <path d="M50 90 Q60 40 100 40 Q140 40 150 90 L150 180 Q140 130 130 95 Q120 80 100 80 Q80 80 70 95 Q60 130 50 180 Z"
        fill="#6B2C8C"/>
  <!-- 眼睛（半闭，神秘） -->
  <path d="M75 105 Q85 100 95 105" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <path d="M105 105 Q115 100 125 105" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <!-- 嘴 -->
  <path d="M92 128 Q100 132 108 128" stroke="#8B1A1A" stroke-width="2" fill="none"/>
  <!-- 漂浮的积分符号 -->
  <text x="40" y="60" font-family="serif" font-size="22" fill="#5A189A" opacity="0.6">∫</text>
  <text x="160" y="70" font-family="serif" font-size="22" fill="#5A189A" opacity="0.6">∑</text>
  <!-- 名字标签 -->
  <text x="100" y="240" text-anchor="middle"
        font-family="sans-serif" font-size="14" fill="#FFF" font-weight="bold">高数</text>
</svg>
